# NextJob — nginx site configuration
# Port 80: redirect everything to HTTPS
# Port 443: serve frontend statics + reverse-proxy /api/ to gunicorn

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Self-signed for the test VM.
    # After buying the domain, certbot replaces these two lines automatically.
    ssl_certificate     /etc/nginx/ssl/nextjob.crt;
    ssl_certificate_key /etc/nginx/ssl/nextjob.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # CV uploads are limited to 5 MB in Flask; give nginx a little headroom
    client_max_body_size 6M;

    # --- security headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- frontend (Medientechnik team drops build here) ---
    root /var/www/nextjob/frontend;
    index index.html;

    location / {
        # SPA-friendly: unknown paths fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://unix:/run/nextjob/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # never serve dotfiles (.env, .git, ...)
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/nextjob.access.log;
    error_log  /var/log/nginx/nextjob.error.log;
}
