# NextJob - nginx site
#   /api/      -> gunicorn on 127.0.0.1:8000 (deploy/nextjob-api.service)
#   /uploads/  -> images the API saved (UPLOAD_FOLDER)
#   /          -> frontend build
#
# Install:
#   sudo cp deploy/nginx-nextjob.conf /etc/nginx/sites-available/nextjob
#   sudo ln -sf /etc/nginx/sites-available/nextjob /etc/nginx/sites-enabled/nextjob
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTP only for now. HTTPS is added once the school has set up the subdomain.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 3000;
    listen [::]:3000;
    server_name _;

    # Flask accepts up to 8 MB per request (MAX_CONTENT_LENGTH)
    client_max_body_size 9M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- REST API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- uploaded images (must match UPLOAD_FOLDER in /etc/nextjob/nextjob.env) ---
    location /uploads/ {
        alias /var/lib/nextjob/uploads/;
        expires 7d;
    }

    # --- frontend build ---
    root /var/www/nextjob;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never serve dotfiles (.env, .git, ...)
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/nextjob.access.log;
    error_log  /var/log/nginx/nextjob.error.log;
}
